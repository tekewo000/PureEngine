name: Code quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Analyze, build and run checks
        shell: pwsh
        run: ./tools/code-quality.ps1 -Check
